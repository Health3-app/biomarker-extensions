<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:440px; height:280px;
    background: linear-gradient(135deg, #164445 0%, #0a2e2f 40%, #07A06D 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Manrope',sans-serif; overflow:hidden; position:relative;
  }
  .deco { position:absolute; top:-40px; right:-30px; width:160px; height:160px; border-radius:50%; background:rgba(79,221,195,0.08); }
  .deco2 { position:absolute; bottom:-50px; left:-20px; width:120px; height:120px; border-radius:50%; background:rgba(7,160,109,0.06); }
  .layout { display:flex; align-items:center; gap:24px; padding:0 30px; position:relative; z-index:1; }
  .logo { width:56px; height:56px; border-radius:12px; background:rgba(255,255,255,0.12); overflow:hidden; flex-shrink:0; box-shadow:0 0 0 1px rgba(255,255,255,0.15); }
  .logo img { width:56px; height:56px; }
  .text { color:white; }
  .text h1 { font-size:22px; font-weight:800; line-height:1.2; letter-spacing:-0.3px; margin-bottom:6px; }
  .text h1 span { color:#4FDDC3; }
  .text p { font-size:13px; color:rgba(255,255,255,0.65); font-weight:600; line-height:1.4; }
  .badge { display:inline-block; margin-top:10px; padding:4px 12px; background:rgba(79,221,195,0.2); border:1px solid rgba(79,221,195,0.4); border-radius:14px; font-size:11px; font-weight:700; color:#4FDDC3; }
</style>
</head>
<body>
  <div class="deco"></div><div class="deco2"></div>
  <div class="layout">
    <div class="logo"><img src="../shared/styles/logo64.png"></div>
    <div class="text">
      <h1>Biomarker <span>Unit Converter</span></h1>
      <p>Convert mg/dL ↔ mmol/L and 935 more lab value units instantly</p>
      <div class="badge">182 biomarkers · Free</div>
    </div>
  </div>
</body>
</html>
